name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04   # Emacs 29 (22.04 ships 27.1, too old for current magit)
            asset: emacs-sync-linux-x86_64
          - os: ubuntu-24.04-arm
            asset: emacs-sync-linux-arm64
          - os: macos-14
            asset: emacs-sync-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Emacs and vterm build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y emacs-nox cmake build-essential libtool-bin git
      - name: Install Emacs and vterm build deps (macOS)
        if: runner.os == 'macOS'
        run: brew install emacs libtool

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      - name: Install config + packages into a throwaway home and exercise them
        run: tests/smoke.sh build/emacs-sync "$(command -v emacs)"

      - name: Package binary
        run: |
          mkdir -p dist
          cp build/emacs-sync dist/${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes
